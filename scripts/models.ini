version = 1

; Model presets for llama-server router mode. Only `ultron` is used: the chat
; names ultron, ultron-think and ultron-agent all point to it through LiteLLM
; (compose/litellm-config.yaml). The old-* presets are kept on purpose and never
; load unless something asks for them by name; with --models-max 1 such a request
; would unload `ultron` (see README, Models).
; Paths are relative to the repository root (the server's working directory).

[*]
flash-attn = on
cache-type-k = q8_0
cache-type-v = q8_0
parallel = 1
load-mode = none
cache-reuse = 256
cache-ram = 2048
reasoning-format = deepseek
jinja = true

; The one model: official Qwen3.6-35B-A3B (MoE, 3B active) with vision and MTP.
; Experts of 28 layers on the CPU. Measured 2026-11-22 (logs/one-model-stage1.md):
; ~55 tok/s with MTP, ~11.1 GB VRAM at 48k context, loads in ~25-35 s.
; Samplers are Qwen's non-thinking values; ultron-think overrides them in LiteLLM.
[ultron]
model = ./models/Qwen3.6-35B-A3B-UD-Q4_K_M-MTP.gguf
mmproj = ./models/mmproj-Qwen3.6-35B-A3B-F16.gguf
n-gpu-layers = 99
n-cpu-moe = 28
ctx-size = 49152
ubatch-size = 1024
batch-size = 2048
spec-type = draft-mtp
spec-draft-n-max = 2
chat-template-kwargs = {"enable_thinking":false}
temp = 0.7
top-p = 0.8
top-k = 20
min-p = 0.0
presence-penalty = 1.5
load-on-startup = true

; Kept, unused: the old fast chat model (Gemma 4 12B Heretic), fully on the GPU.
[old-gemma-12b]
model = ./models/gemma-4-12B-it-heretic-Q4_K_M.gguf
n-gpu-layers = all
ctx-size = 24576
chat-template-kwargs = {"enable_thinking":false}
temp = 1.0
top-p = 0.95
top-k = 64

; Kept, unused: the old agent model (Qwen3.6-35B-A3B Heretic), experts of 24 layers on the CPU.
[old-qwen-heretic]
model = ./models/Qwen3.6-35B-A3B-uncensored-heretic-Native-MTP-Preserved-Q4_K_M.gguf
n-gpu-layers = 99
n-cpu-moe = 24
ctx-size = 32768
chat-template-kwargs = {"enable_thinking":false}
temp = 0.7
top-p = 0.8
top-k = 20
