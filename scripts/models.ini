version = 1

; Model presets for llama-server router mode. One model is in VRAM at a time
; (--models-max 1); asking for the other by name swaps them.
; Paths are relative to the repository root (the server's working directory).

[*]
flash-attn = on
cache-type-k = q8_0
cache-type-v = q8_0
parallel = 1
load-mode = none
cache-reuse = 256
cache-ram = 2048
reasoning-format = deepseek
jinja = true

; Fast chat model: fully on the GPU, ~37 tok/s, ~9 GB VRAM.
[ultron]
model = ./models/gemma-4-12B-it-heretic-Q4_K_M.gguf
n-gpu-layers = all
ctx-size = 24576
chat-template-kwargs = {"enable_thinking":false}
temp = 1.0
top-p = 0.95
top-k = 64
load-on-startup = true

; Agent model: MoE, experts of 24 layers on the CPU. Measured ~50 tok/s,
; ~10.1 GB VRAM, ~11.6 GB RAM, loads in ~24 s.
[ultron-agent]
model = ./models/Qwen3.6-35B-A3B-uncensored-heretic-Native-MTP-Preserved-Q4_K_M.gguf
n-gpu-layers = 99
n-cpu-moe = 24
ctx-size = 32768
chat-template-kwargs = {"enable_thinking":false}
temp = 0.7
top-p = 0.8
top-k = 20
