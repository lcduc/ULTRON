# SearXNG for Open WebUI web search. Internal use only (no published port).
# The secret key comes from the SEARXNG_SECRET environment variable.
use_default_settings: true

server:
  # Rate limiter needs a Valkey instance and is pointless on a private network.
  limiter: false
  image_proxy: false

search:
  # Open WebUI needs the JSON format; without it every query returns 403.
  formats:
    - html
    - json

outgoing:
  # The default 3 s timeout made the news engines (Bing, Brave, DuckDuckGo, Google, Wikinews) time out
  # from this PC, and each timeout suspended the engine for a while, so news searches came back empty.
  request_timeout: 10.0
  max_request_timeout: 15.0

engines:
  # Reuters answers 401 to every request, so it never returns anything.
  - name: reuters
    disabled: true
