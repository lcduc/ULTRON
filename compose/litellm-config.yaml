model_list:
  # Fast chat: thinking off (also the model server's default).
  - model_name: ultron
    litellm_params:
      model: openai/ultron
      api_base: http://host.docker.internal:8080/v1
      api_key: os.environ/LLAMA_API_KEY
      extra_body:
        chat_template_kwargs:
          enable_thinking: false

  # Same loaded model with step-by-step reasoning switched on.
  - model_name: ultron-think
    litellm_params:
      model: openai/ultron
      api_base: http://host.docker.internal:8080/v1
      api_key: os.environ/LLAMA_API_KEY
      extra_body:
        chat_template_kwargs:
          enable_thinking: true

  # Larger agent model for multi-step work. Selecting it swaps models on the GPU
  # (about 25 s); selecting ultron again swaps back.
  - model_name: ultron-agent
    litellm_params:
      model: openai/ultron-agent
      api_base: http://host.docker.internal:8080/v1
      api_key: os.environ/LLAMA_API_KEY
      timeout: 900
      extra_body:
        chat_template_kwargs:
          enable_thinking: false

litellm_settings:
  callbacks: ["prometheus"]
  # /metrics requires the master key as Bearer (default since v1.85.0)
  require_auth_for_metrics_endpoint: true

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  # spend/request logs are written to Postgres (disable_spend_logs defaults to false)
  disable_spend_logs: false
  # token counts are logged; message text is NOT copied into Postgres
  # (chat history already lives in Open WebUI). Set true for full traces.
  store_prompts_in_spend_logs: false
