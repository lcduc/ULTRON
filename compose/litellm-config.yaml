model_list:
  # All three names use the same loaded model (`ultron` on the model server:
  # Qwen3.6-35B-A3B), so switching between them never swaps models. They differ
  # only in these settings and in their Open WebUI prompts and tools.

  # Chat and voice: thinking off, Qwen's non-thinking samplers (server defaults).
  - model_name: ultron
    litellm_params:
      model: openai/ultron
      api_base: http://host.docker.internal:8080/v1
      api_key: os.environ/LLAMA_API_KEY
      extra_body:
        chat_template_kwargs:
          enable_thinking: false

  # Same model with step-by-step reasoning on, and Qwen's thinking samplers.
  - model_name: ultron-think
    litellm_params:
      model: openai/ultron
      api_base: http://host.docker.internal:8080/v1
      api_key: os.environ/LLAMA_API_KEY
      temperature: 1.0
      top_p: 0.95
      presence_penalty: 1.5
      extra_body:
        top_k: 20
        chat_template_kwargs:
          enable_thinking: true

  # Same model for multi-step terminal work: thinking off, no presence penalty
  # (repeating paths and commands in tool calls is normal), long timeout.
  - model_name: ultron-agent
    litellm_params:
      model: openai/ultron
      api_base: http://host.docker.internal:8080/v1
      api_key: os.environ/LLAMA_API_KEY
      timeout: 900
      presence_penalty: 0.0
      extra_body:
        chat_template_kwargs:
          enable_thinking: false

  # ---------------------------------------------------------------- cloud models (optional)
  # Keys and model ids come from compose/.env (section "Cloud models"): OPENAI_CLOUD_API_KEY +
  # OPENAI_CLOUD_MODEL, ANTHROPIC_API_KEY + ANTHROPIC_MODEL, GEMINI_API_KEY + GEMINI_MODEL.
  # A model without a key fails, and the paper digest moves on (CLOUD_PRIORITY, then `ultron`).
  # They also appear in Open WebUI's model picker: a chat with one of them is sent to that provider.
  # After changing a key or model in .env: docker compose -p ultron up -d litellm
  - model_name: cloud-gpt
    litellm_params:
      model: os.environ/OPENAI_CLOUD_MODEL
      custom_llm_provider: openai
      api_key: os.environ/OPENAI_CLOUD_API_KEY
      timeout: 600
  - model_name: cloud-claude
    litellm_params:
      model: os.environ/ANTHROPIC_MODEL
      custom_llm_provider: anthropic
      api_key: os.environ/ANTHROPIC_API_KEY
      timeout: 600
  - model_name: cloud-gemini
    litellm_params:
      model: os.environ/GEMINI_MODEL
      custom_llm_provider: gemini
      api_key: os.environ/GEMINI_API_KEY
      timeout: 600

litellm_settings:
  callbacks: ["prometheus"]
  # /metrics requires the master key as Bearer (default since v1.85.0)
  require_auth_for_metrics_endpoint: true

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  # spend/request logs are written to Postgres (disable_spend_logs defaults to false)
  disable_spend_logs: false
  # token counts are logged; message text is NOT copied into Postgres
  # (chat history already lives in Open WebUI). Set true for full traces.
  store_prompts_in_spend_logs: false
