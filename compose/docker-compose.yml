# Ultron local LLM chat stack.
#   Stage 1:  docker compose up -d                                   (open-webui only)
#   Stage 2:  docker compose --profile gateway up -d                 (+ postgres, litellm)
#   Stage 3:  set OPENAI_API_BASE_URL=http://litellm:4000/v1 in .env, then re-run up -d
#   Monitoring: docker compose --profile monitoring up -d            (prometheus, grafana, uptime-kuma)
name: ultron

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  open-webui:
    image: ghcr.io/open-webui/open-webui:v0.13.3
    restart: unless-stopped
    networks: [default, agent]
    ports:
      - "127.0.0.1:3000:8080"
    volumes:
      - open-webui-data:/app/backend/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      OPENAI_API_BASE_URL: ${OPENAI_API_BASE_URL}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      ENABLE_OLLAMA_API: "false"
      WEBUI_SECRET_KEY: ${WEBUI_SECRET_KEY}
      ENABLE_SIGNUP: ${ENABLE_SIGNUP}
      DEFAULT_USER_ROLE: pending
      SCARF_NO_ANALYTICS: "true"
      DO_NOT_TRACK: "true"
      ANONYMIZED_TELEMETRY: "false"
      ENABLE_COMMUNITY_SHARING: "false"
      ENABLE_VERSION_UPDATE_CHECK: "false"
      ENABLE_CODE_EXECUTION: "false"
      # Code interpreter runs in the browser sandbox (Pyodide), never on the PC.
      ENABLE_CODE_INTERPRETER: "true"
      CODE_INTERPRETER_ENGINE: pyodide
      # Web search through the internal SearXNG container.
      ENABLE_WEB_SEARCH: "true"
      WEB_SEARCH_ENGINE: searxng
      SEARXNG_QUERY_URL: http://searxng:8080/search
      WEB_SEARCH_RESULT_COUNT: "3"
      WEB_SEARCH_CONCURRENT_REQUESTS: "2"
      WEB_FETCH_MAX_CONTENT_LENGTH: "8000"
      # Never let fetched pages point the bot at this PC or the home network.
      ENABLE_LOCAL_WEB_FETCH: "false"
      # Stop a looping model after 40 tool rounds (no per-model setting exists in 0.13.3; the
      # agent planner caps tasks at 40 rounds, chat models rarely use more than a few).
      CHAT_RESPONSE_MAX_TOOL_CALL_ITERATIONS: "40"
      # Google Calendar tool (tools/google_calendar.py). Written by scripts/google-auth.py.
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REFRESH_TOKEN: ${GOOGLE_REFRESH_TOKEN:-}
      # Voice. Speech-to-text: local Whisper inside this container, on the CPU so it never
      # competes with the chat model for VRAM. Text-to-speech: the kokoro container below.
      # Nothing is sent outside this PC.
      AUDIO_STT_ENGINE: ""
      WHISPER_MODEL: small.en
      WHISPER_MODEL_AUTO_UPDATE: "true"
      # Skip silent and noise-only stretches, so background noise is not "heard" as words.
      WHISPER_VAD_FILTER: "true"
      AUDIO_TTS_ENGINE: openai
      AUDIO_TTS_OPENAI_API_BASE_URL: http://kokoro:8880/v1
      AUDIO_TTS_OPENAI_API_KEY: not-needed
      AUDIO_TTS_MODEL: kokoro
      AUDIO_TTS_VOICE: am_michael
      AUDIO_TTS_SPLIT_ON: punctuation
    healthcheck:
      test: ["CMD-SHELL", "curl --silent --fail http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    logging: *default-logging

  searxng:
    image: searxng/searxng:2026.11.12-de722ab1b
    restart: unless-stopped
    # No published port: only reachable from other containers on this network.
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET}
      SEARXNG_BASE_URL: http://searxng:8080/
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/healthz || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    logging: *default-logging

  # Text-to-speech for the chat's read-aloud and voice call (Kokoro, OpenAI-compatible API).
  # CPU only, no published port; Open WebUI reaches it at http://kokoro:8880/v1.
  kokoro:
    image: ghcr.io/remsky/kokoro-fastapi-cpu:v0.10.0
    restart: unless-stopped
    mem_limit: 3g
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8880/health', timeout=5).status == 200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    logging: *default-logging

  # Google Calendar as an MCP server (mcp/google-calendar). Open WebUI connects to it at
  # http://calendar-mcp:8000/mcp with CALENDAR_MCP_API_KEY. No published port, and not on
  # the agent network, so the sandbox cannot reach it.
  calendar-mcp:
    build: ../mcp/google-calendar
    image: ultron/calendar-mcp:1.0.0
    restart: unless-stopped
    environment:
      MCP_API_KEY: ${CALENDAR_MCP_API_KEY}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REFRESH_TOKEN: ${GOOGLE_REFRESH_TOKEN:-}
    read_only: true
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5).status == 200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    logging: *default-logging

  # Phone pushes (ntfy). Published on localhost only; `tailscale serve` exposes it to the
  # tailnet on HTTPS port 8443 so the iPhone app can reach it. Needs a user or token.
  ntfy:
    image: binwiederhier/ntfy:v2.37.2
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/etc/ntfy/init.sh"]
    # Its own resolvers: one failed lookup of ntfy.sh drops that message's iPhone wake-up
    # (seen once through Docker Desktop's DNS forwarder on 2026-11-21).
    dns: [1.1.1.1, 9.9.9.9]
    ports:
      - "127.0.0.1:2586:80"
    environment:
      NTFY_BASE_URL: ${NTFY_BASE_URL}
      NTFY_USER: ultron
      NTFY_PASSWORD: ${NTFY_PASSWORD}
      NTFY_TOPIC: ${NTFY_TOPIC}
      NTFY_AUTH_TOKENS: ultron:${NTFY_TOKEN}:assistant-cron
    volumes:
      - ./ntfy/server.yml:/etc/ntfy/server.yml:ro
      - ./ntfy/init.sh:/etc/ntfy/init.sh:ro
      - ntfy-data:/var/lib/ntfy
    mem_limit: 128m
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:80/v1/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging: *default-logging

  # Morning briefing (07:00) and evening preview (21:00), pushed to the phone through ntfy.
  # Settings: services/assistant-cron/config.yaml. Reads calendar, tasks and mail through the
  # shared code in mcp/google-calendar (mounted read-only).
  assistant-cron:
    build: ../services/assistant-cron
    image: ultron/assistant-cron:1.0.0
    restart: unless-stopped
    environment:
      PYTHONPATH: /mcp
      PYTHONDONTWRITEBYTECODE: "1"
      OPENAI_API_BASE_URL: ${OPENAI_API_BASE_URL}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      NTFY_URL: http://ntfy:80
      NTFY_TOPIC: ${NTFY_TOPIC}
      NTFY_TOKEN: ${NTFY_TOKEN}
      ULTRON_PUBLIC_URL: ${ULTRON_PUBLIC_URL:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REFRESH_TOKEN: ${GOOGLE_REFRESH_TOKEN:-}
    volumes:
      - ../mcp/google-calendar:/mcp:ro
      - ../services/assistant-cron/config.yaml:/app/config.yaml:ro
    read_only: true
    mem_limit: 256m
    depends_on:
      ntfy:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import os,sys,time; sys.exit(0 if time.time()-os.path.getmtime('/tmp/heartbeat') < 300 else 1)"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    tmpfs:
      - /tmp
    logging: *default-logging

  # Sandbox for the agent: shell, files and code execution inside this container.
  # Sees only its own home volume and the workspace folder. No published port and
  # no Docker socket; Open WebUI reaches it at http://open-terminal:8000.
  open-terminal:
    profiles: ["agent"]
    image: ghcr.io/open-webui/open-terminal:0.17.8
    restart: unless-stopped
    environment:
      OPEN_TERMINAL_API_KEY: ${OPEN_TERMINAL_API_KEY}
      # The agent model cannot read images, so screenshot-based desktop and browser
      # tools only produce errors. Apps are operated through skills instead.
      OPEN_TERMINAL_ENABLE_DESKTOP: "false"
      OPEN_TERMINAL_ENABLE_BROWSER: "false"
    volumes:
      - open-terminal-home:/home/user
      - ${AGENT_WORKSPACE}:/home/user/workspace
      # Skills (instructions + helper scripts per app) come from this repository, read-only.
      - ../skills:/home/user/workspace/skills:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    mem_limit: 2g
    # Own network shared only with Open WebUI, so the sandbox cannot reach the
    # database, gateway or monitoring containers directly.
    networks: [agent]
    logging: *default-logging

  postgres:
    profiles: ["gateway"]
    image: postgres:18.7-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      # Postgres 18+ images keep PGDATA under /var/lib/postgresql/<major>/docker
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    logging: *default-logging

  litellm:
    profiles: ["gateway"]
    image: ghcr.io/berriai/litellm:v1.109.1
    restart: unless-stopped
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    ports:
      - "127.0.0.1:4000:4000"
    volumes:
      - ./litellm-config.yaml:/app/config.yaml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      LITELLM_SALT_KEY: ${LITELLM_SALT_KEY}
      LLAMA_API_KEY: ${LLAMA_API_KEY}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:4000/health/liveliness', timeout=5).status == 200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    logging: *default-logging

  prometheus:
    profiles: ["monitoring"]
    image: prom/prometheus:v3.16.0
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ../monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../monitoring/secrets:/etc/prometheus/secrets:ro
      - prometheus-data:/prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:9090/-/healthy || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging: *default-logging

  grafana:
    profiles: ["monitoring"]
    image: grafana/grafana:13.3.1
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ../monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s
    logging: *default-logging

  uptime-kuma:
    profiles: ["monitoring"]
    image: louislam/uptime-kuma:2.5.11
    restart: unless-stopped
    ports:
      - "127.0.0.1:3002:3001"
    volumes:
      - uptime-kuma-data:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "extra/healthcheck"]
      interval: 60s
      timeout: 30s
      retries: 5
      start_period: 180s
    logging: *default-logging

volumes:
  open-terminal-home:
  open-webui-data:
  postgres-data:
  prometheus-data:
  grafana-data:
  uptime-kuma-data:
  ntfy-data:

networks:
  agent:
