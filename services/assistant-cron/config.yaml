# Settings for the three briefings: morning weather, office briefing, evening preview.
# After editing, restart the job: docker compose up -d --force-recreate assistant-cron
# (run from the compose folder). Test without waiting: see README, "Morning briefing and phone pushes".

timezone: Asia/Ho_Chi_Minh

# Local time (24 h, HH:MM) each briefing is sent. Set a time to "" to turn that briefing off.
#   morning = weather and clothing tip (names the first event only if it starts before 08:30, the office briefing time)
#   office  = today's schedule, news and markets; working days only (see below)
#   evening = tomorrow's schedule and weather
times:
  morning: "06:00"
  office: "08:30"
  evening: "21:00"

# Which parts go into each briefing. (Mail is no longer part of any briefing.)
sections:
  morning:
    calendar: true    # only to find an event before 08:30
    weather: true
  office:
    calendar: true
    tasks: true
    news: true
    markets: true
  evening:
    calendar: true
    tasks: true
    weather: true

# The evening push also carries a short MP3 read in Ultron's voice (Kokoro text-to-speech): tomorrow's
# schedule and weather, written by code. If the audio fails, the normal text push goes out alone.
# enabled: false = text only, exactly as before.
spoken:
  enabled: true
  voice: bm_lewis
  max_items: 6      # schedule items read out, then "and N more"
  attach_to_push: false   # true = the 21:00 push also carries the MP3 (the iPhone Shortcut fetches it otherwise)

# The office briefing is skipped on days not listed here, on Vietnamese public holidays, and on days
# with an all-day event whose title contains one of these words (any case, whole words).
working_days: [Monday, Tuesday, Wednesday, Thursday, Friday]
day_off_keywords: [Off, Leave, "Nghỉ", OOO, Vacation]
holiday_calendar: "en.vietnamese#holiday@group.v.calendar.google.com"
# Only events described as "Public holiday" count (Christmas and similar "Observance" days do not).
# Extra event titles to treat as holidays anyway, e.g. if Google's descriptions ever change:
holiday_names: []

# Rows of the Markets table, in order: bitcoin, ethereum, solana, chainlink, nasdaq100, sp500, vnindex, eur, usd, gold.
market_items: [bitcoin, ethereum, solana, chainlink, nasdaq100, sp500, vnindex, eur, usd, gold]

# How long after its time a briefing is still sent, e.g. after the PC was off. Default 4. A briefing
# whose chat already exists is never sent again, so restarts inside this window are safe.
late_grace_hours: 4

# Days with no briefing, by English name, e.g. [Saturday, Sunday]. Empty = every day.
quiet_days: []

city:
  name: Hanoi
  latitude: 21.0285
  longitude: 105.8542

# ntfy = push to the phone (falls back to email if ntfy fails). email = Gmail to yourself only.
channel: ntfy

# Chat model that writes the text (a name served by the gateway).
model: ultron

# Two news searches (SearXNG news category, last 24 hours). Plain words: SearXNG engines ignore OR.
# A story whose article cannot be read needs a search snippet of at least news_min_snippet characters.
news_min_snippet: 200
# Code reads the top articles; the model picks up to chat_stories and summarizes them.
news_queries:
  politics: "war elections world politics"
  economy: "gold price stock market bitcoin"

# Limits for the push and the model's answer.
limits:
  greeting_chars: 140
  tip_chars: 100
  schedule_items: 6   # schedule items in the evening push, then "+N more"
  title_chars: 40
  chat_stories: 4     # news stories in the office chat
  headline_words: 10
  summary_chars: 450

# Who writes the greeting and the clothing tip. (The same butler voice as in Open WebUI chats.)
persona: >-
  You are Ultron, the user's personal AI assistant. You speak like a loyal, composed butler in the
  manner of Alfred or JARVIS: polite, warm, a touch of dry wit. Address the user as 'sir'.

# Each briefing is also saved as an Open WebUI chat titled "Briefing · ...". Such chats are deleted
# after this many days. Other chats are never touched.
chat_retention_days: 7

# Open WebUI folder that holds every chat the assistant creates (made if missing). "" = no folder.
chat_folder: "Notifications"

# The model is retried for this long (GPU busy, model loading) before the fallbacks are used.
model_wait_minutes: 30
model_timeout_seconds: 180

# "Time to leave" pushes for timed calendar events that have a location (not declined or cancelled).
# Leave time = start - travel_minutes (- rain_extra_minutes if rain is likely at the start hour);
# the push comes notice_minutes before that. Sent once per event and start time. Nothing is sent
# between quiet_start and quiet_end. Keep enabled: false until you want them.
reminders:
  enabled: false
  check_minutes: 5          # how often the calendar is checked
  lookahead_hours: 2        # only events starting within this window
  travel_minutes: 30
  rain_extra_minutes: 10
  rain_threshold: 40        # rain is "likely" at this precipitation probability % or more (or a rain weather code)
  notice_minutes: 15
  quiet_start: "22:00"
  quiet_end: "06:00"

# One push when rain is about to start ("Rain expected in about 30 minutes, sir."). Needs it to be dry
# now and rain likely (reminders.rain_threshold) within lookahead_minutes. At most one per
# cooldown_hours (a time-to-leave reminder that warned about rain counts). Skipped when the rain is
# already in the morning briefing's rain window, and between quiet_start and quiet_end.
rain_alerts:
  enabled: true
  check_minutes: 15
  lookahead_minutes: 60
  cooldown_hours: 3
  quiet_start: "22:00"
  quiet_end: "06:00"
