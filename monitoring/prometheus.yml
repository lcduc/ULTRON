global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: llama-server
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/secrets/llama_api_key
    static_configs:
      - targets: ["host.docker.internal:8080"]

  - job_name: litellm
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/secrets/litellm_master_key
    static_configs:
      - targets: ["litellm:4000"]

  - job_name: gpu
    static_configs:
      - targets: ["host.docker.internal:9835"]
