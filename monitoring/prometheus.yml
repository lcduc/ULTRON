global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # The model server runs in router mode: per-model /metrics requests would force
  # a model swap, so speed and token metrics come from the LiteLLM job instead.

  - job_name: litellm
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/secrets/litellm_master_key
    static_configs:
      - targets: ["litellm:4000"]

  - job_name: gpu
    static_configs:
      - targets: ["host.docker.internal:9835"]
